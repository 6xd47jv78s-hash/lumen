name: Deploy to GitHub Pages

# Publishes the site as a static export to the `gh-pages` branch.
#
# Why the branch rather than the Pages deployment API: creating a Pages site
# through the API needs repo-admin credentials, which a workflow's automatic
# GITHUB_TOKEN doesn't have — `actions/configure-pages` fails with "Resource not
# accessible by integration". Pushing a `gh-pages` branch enables Pages on its
# own, so this route needs no manual setup at all.
#
# Live at https://<owner>.github.io/<repo>/

on:
  push:
    branches:
      - main
      - claude/marketlab-education-platform-oan1lz
  workflow_dispatch:

permissions:
  contents: write

# Never let two publishes race.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Publish only what passes. Same checks as `npm run check` locally, minus
      # the site audit, which drives `next start` and so needs the server build
      # rather than the export.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run audit

      - name: Build static export
        env:
          NEXT_OUTPUT: export
          # Project pages live under /<repo>, not at the domain root.
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      - name: Publish to gh-pages
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${{ github.sha }}"
          git push -f \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages
          echo "Published to https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" \
            >> "$GITHUB_STEP_SUMMARY"
