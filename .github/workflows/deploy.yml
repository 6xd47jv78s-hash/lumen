name: Deploy to GitHub Pages

# Deploys the site as a fully static export. The app has no backend, so nothing
# is lost by hosting it as plain files.
#
# One-time setup, which has to be done by a human: Settings → Pages → Build and
# deployment → Source → "GitHub Actions". The workflow token deliberately can't
# do this — creating a Pages site requires repo-admin credentials. Until it's
# set, everything builds and the "Check GitHub Pages is enabled" step explains
# what to do.

on:
  push:
    branches:
      - main
      - claude/marketlab-education-platform-oan1lz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; always finish the most recent one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Deploy only what passes. These are the same checks `npm run check` runs
      # locally, minus the site audit, which needs the server build rather than
      # the export.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run audit

      - name: Build static export
        env:
          NEXT_OUTPUT: export
          # Project pages live under /<repo>, not at the domain root.
          NEXT_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: npm run build

      # configure-pages reports a bare "Not Found" when Pages has never been
      # enabled, which gives no clue what to do. The workflow token can't enable
      # it either — creating a Pages site needs repo-admin credentials, not the
      # automatic GITHUB_TOKEN — so check first and say exactly what's needed.
      - name: Check GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "::error title=GitHub Pages is not enabled::Open \
          https://github.com/${{ github.repository }}/settings/pages and set \
          'Build and deployment' → Source → 'GitHub Actions'. Then re-run this workflow. \
          The workflow token cannot do this itself: creating a Pages site requires \
          repo-admin credentials."
            exit 1
          fi
          echo "Pages is enabled."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
